# The password vault core and its libsodium build, without Gecko: a few
# minutes per run (tools/vault/build.py; docs/PASSWORDS.md §15).
#
# - core: the vault, store and transaction tests (with a failure injected,
#   and the process killed, at every step of a password change and a key
#   replacement) and libsodium's own known-answer tests, on Linux with gcc
#   and clang under ASan/UBSan, and on Windows with clang-cl (Gecko's
#   Windows compiler)
# - release check: the core compiled as the browser does, without the test
#   hooks, and checked for them
# - cross-OS: a vault made on Linux opens on Windows and the other way round;
#   both open the v2 file committed in the repo and refuse the v1 one
# - fuzz: the file parser and everything behind it, 5 minutes per run

name: Password vault

on:
  push:
    paths:
      - "app/components/passwords/vault/**"
      - "app/third_party/libsodium/**"
      - "tools/vault/**"
      - ".github/workflows/passwords.yml"
  pull_request:
    paths:
      - "app/components/passwords/vault/**"
      - "app/third_party/libsodium/**"
      - "tools/vault/**"
      - ".github/workflows/passwords.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FIXTURE: app/components/passwords/vault/tests/fixtures/v2-windows.bwv
  FIXTURE_V1: app/components/passwords/vault/tests/fixtures/v1-dev-windows.bwv

jobs:
  linux:
    name: Linux (${{ matrix.cc }}, ASan+UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: python3 -I tools/vault/build.py --cc ${{ matrix.cc }} --sanitize --out obj-vault --run
      - name: Open the committed v2 vault; refuse the v1 one
        run: |
          obj-vault/vault_test open "$FIXTURE"
          obj-vault/vault_test older "$FIXTURE_V1"
      - name: Release objects have no test hooks
        run: python3 -I tools/vault/build.py --cc ${{ matrix.cc }} --out obj-vault --release-check
      - name: Make a vault for Windows to open
        if: matrix.cc == 'gcc'
        run: obj-vault/vault_test create vault-linux.bwv
      - uses: actions/upload-artifact@v4
        if: matrix.cc == 'gcc'
        with:
          name: vault-linux
          path: vault-linux.bwv
          retention-days: 3

  windows:
    name: Windows (clang-cl)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set PATH=%ProgramFiles%\LLVM\bin;%PATH%
          python -I tools/vault/build.py --cc clang-cl --out obj-vault --run || exit /b 1
          obj-vault\vault_test.exe open %FIXTURE% || exit /b 1
          obj-vault\vault_test.exe older %FIXTURE_V1% || exit /b 1
          python -I tools/vault/build.py --cc clang-cl --out obj-vault --release-check || exit /b 1
          obj-vault\vault_test.exe create vault-windows.bwv
      - uses: actions/upload-artifact@v4
        with:
          name: vault-windows
          path: vault-windows.bwv
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: vault-test-windows
          path: obj-vault/vault_test.exe
          retention-days: 3

  cross-os-linux:
    name: Windows vault opens on Linux
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vault-windows
      - run: python3 -I tools/vault/build.py --out obj-vault
      - run: obj-vault/vault_test open vault-windows.bwv

  cross-os-windows:
    name: Linux vault opens on Windows
    needs: [linux, windows]
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vault-linux
      - uses: actions/download-artifact@v4
        with:
          name: vault-test-windows
      - shell: pwsh
        run: ./vault_test.exe open vault-linux.bwv

  fuzz:
    name: Fuzz the vault parser (5 min)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fuzz
        run: python3 -I tools/vault/build.py --cc clang --out obj-fuzz --fuzz 300
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: |
            obj-fuzz/crash-*
            obj-fuzz/leak-*
            obj-fuzz/timeout-*
            obj-fuzz/oom-*
          retention-days: 14
