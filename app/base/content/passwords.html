<!-- about:passwords: the saved logins (docs/PASSWORDS.md §11.5). A list with
     search on the left, the selected login on the right; on a narrow window
     they stack. Locked, it asks for the master password; with no vault yet,
     it sets one up. -->
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width"/>
  <meta http-equiv="Content-Security-Policy"
        content="default-src chrome:; img-src chrome:; style-src chrome:; object-src 'none'"/>
  <title data-l10n-id="passwords-page-title"></title>
  <link rel="stylesheet" href="chrome://browser-wip/skin/pages.css"/>
  <link rel="stylesheet" href="chrome://browser-wip/skin/passwords.css"/>
  <link rel="localization" href="branding/brand.ftl"/>
  <link rel="localization" href="browser-wip/passwords.ftl"/>
  <script src="chrome://browser-wip/content/passwords-page.js"></script>
</head>
<body>
  <header id="header">
    <h1 data-l10n-id="passwords-heading"></h1>
    <span id="status" class="status-pill" hidden="hidden">
      <span class="status-dot"></span><span id="status-text"></span>
    </span>
    <span class="spacer"></span>
    <label id="search-box" class="search" hidden="hidden">
      <img class="search-icon" src="chrome://browser-wip/skin/icons/search.svg" alt=""/>
      <input id="search" type="search" autocomplete="off" data-l10n-id="passwords-search"/>
    </label>
    <button id="lock" class="secondary" type="button" hidden="hidden" data-l10n-id="passwords-page-lock"></button>
    <button id="add" class="primary" type="button" hidden="hidden" data-l10n-id="passwords-add"></button>
  </header>

  <main id="manager" hidden="hidden">
    <div id="list-pane">
      <h2 id="count"></h2>
      <div id="list" role="listbox" tabindex="0" data-l10n-id="passwords-list"></div>
      <p id="no-results" class="muted" hidden="hidden"></p>
    </div>
    <section id="detail" aria-live="polite"></section>
  </main>

  <main id="gate" hidden="hidden">
    <section id="card-locked" class="card" hidden="hidden" aria-labelledby="locked-title">
      <h2 id="locked-title" class="card-title" data-l10n-id="passwords-locked-title"></h2>
      <p class="muted" data-l10n-id="passwords-locked-text"></p>
      <form id="unlock-form" class="card-row">
        <input id="unlock-password" class="field" type="password" autocomplete="off"
               data-l10n-id="passwords-master-password"/>
        <button id="unlock-submit" class="primary" type="submit" data-l10n-id="passwords-unlock"></button>
      </form>
      <p id="unlock-error" class="error" role="alert" hidden="hidden"></p>
      <button id="forgot" class="link" type="button" data-l10n-id="passwords-forgot"></button>
    </section>

    <section id="card-setup" class="card" hidden="hidden" aria-labelledby="setup-title">
      <h2 id="setup-title" class="card-title" data-l10n-id="passwords-setup-page-title"></h2>
      <p class="muted" data-l10n-id="passwords-setup-page-text"></p>
      <form id="setup-form" class="card-stack">
        <input id="setup-password" class="field" type="password" autocomplete="off"
               data-l10n-id="passwords-setup-password"/>
        <input id="setup-confirm" class="field" type="password" autocomplete="off"
               data-l10n-id="passwords-setup-confirm"/>
        <p id="setup-error" class="error" role="alert" hidden="hidden"></p>
        <p class="muted small" data-l10n-id="passwords-setup-where"></p>
        <div><button id="setup-submit" class="primary" type="submit" data-l10n-id="passwords-setup-page-create"></button></div>
      </form>
    </section>

    <section id="card-forgot" class="card" hidden="hidden" aria-labelledby="forgot-title">
      <h2 id="forgot-title" class="card-title" data-l10n-id="passwords-forgot-title"></h2>
      <p class="muted" data-l10n-id="passwords-forgot-text"></p>
      <div><button id="forgot-back" class="secondary" type="button" data-l10n-id="passwords-forgot-back"></button></div>
    </section>

    <section class="card note-card" aria-labelledby="protects-title">
      <h2 id="protects-title" class="card-title small" data-l10n-id="passwords-protects-title"></h2>
      <p class="muted small" data-l10n-id="passwords-protects-text"></p>
    </section>
  </main>
</body>
</html>
