<!-- about:passwords: the saved logins (docs/PASSWORDS.md §11.5). A list with
     search on the left, the selected login on the right; on a narrow window
     they stack. Locked, it asks for the master password; with no vault yet,
     it sets one up. -->
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width"/>
  <meta http-equiv="Content-Security-Policy"
        content="default-src chrome:; img-src chrome:; style-src chrome:; object-src 'none'"/>
  <title data-l10n-id="passwords-page-title"></title>
  <link rel="stylesheet" href="chrome://browser-wip/skin/pages.css"/>
  <link rel="stylesheet" href="chrome://browser-wip/skin/passwords.css"/>
  <link rel="localization" href="branding/brand.ftl"/>
  <link rel="localization" href="browser-wip/passwords.ftl"/>
  <script src="chrome://browser-wip/content/passwords-page.js"></script>
</head>
<body>
  <header id="header">
    <h1 data-l10n-id="passwords-heading"></h1>
    <span id="status" class="status-pill" hidden="hidden">
      <span class="status-dot"></span><span id="status-text"></span>
    </span>
    <span class="spacer"></span>
    <label id="search-box" class="search" hidden="hidden">
      <img class="search-icon" src="chrome://browser-wip/skin/icons/search.svg" alt=""/>
      <input id="search" type="search" autocomplete="off" data-l10n-id="passwords-search"/>
    </label>
    <button id="lock" class="secondary" type="button" hidden="hidden" data-l10n-id="passwords-page-lock"></button>
    <button id="add" class="primary" type="button" hidden="hidden" data-l10n-id="passwords-add"></button>
    <div id="more-wrap" class="menu-wrap" hidden="hidden">
      <button id="more" class="secondary icon-button" type="button" aria-haspopup="menu" aria-expanded="false"
              aria-controls="more-menu" data-l10n-id="passwords-more-actions">
        <img class="button-icon" src="chrome://browser-wip/skin/icons/more.svg" alt=""/>
      </button>
      <div id="more-menu" class="menu" role="menu" hidden="hidden">
        <button id="menu-import" type="button" role="menuitem" data-l10n-id="passwords-menu-import"></button>
        <button id="menu-export" type="button" role="menuitem" data-l10n-id="passwords-menu-export"></button>
        <button id="menu-settings" type="button" role="menuitem" data-l10n-id="passwords-menu-settings"></button>
      </div>
    </div>
  </header>

  <!-- Export (docs/PASSWORDS.md §9): an encrypted .bwv file by default, or
       plain text behind a warning. Both need the master password. -->
  <dialog id="export-dialog" class="dialog" aria-labelledby="export-title">
    <form id="export-form" class="dialog-body">
      <h2 id="export-title" class="dialog-title" data-l10n-id="passwords-export-title"></h2>
      <div id="export-format" class="segmented" role="radiogroup" data-l10n-id="passwords-export-format">
        <button type="button" role="radio" data-format="bwv" aria-checked="true" data-l10n-id="passwords-export-encrypted"></button>
        <button type="button" role="radio" data-format="csv" aria-checked="false" data-l10n-id="passwords-export-csv"></button>
      </div>
      <p class="muted small bwv-only" data-l10n-id="passwords-export-encrypted-text"></p>
      <div class="warning csv-only">
        <img class="warning-icon" src="chrome://browser-wip/skin/icons/warning.svg" alt=""/>
        <span data-l10n-id="passwords-export-csv-warning"></span>
      </div>
      <label class="dialog-field">
        <span data-l10n-id="passwords-export-master"></span>
        <input id="export-master" class="field" type="password" autocomplete="off"/>
      </label>
      <label class="dialog-field bwv-only">
        <span data-l10n-id="passwords-export-passphrase"></span>
        <input id="export-passphrase" class="field" type="password" autocomplete="off"/>
      </label>
      <label class="dialog-field bwv-only">
        <span data-l10n-id="passwords-export-passphrase-again"></span>
        <input id="export-confirm" class="field" type="password" autocomplete="off"/>
      </label>
      <label class="checkbox csv-only">
        <input id="export-understand" type="checkbox"/>
        <span data-l10n-id="passwords-export-understand"></span>
      </label>
      <p id="export-error" class="error" role="alert" hidden="hidden"></p>
      <p id="export-done" class="done" role="status" hidden="hidden"></p>
      <div class="dialog-buttons">
        <button id="export-cancel" class="secondary" type="button" data-l10n-id="passwords-cancel"></button>
        <button id="export-submit" class="primary" type="submit"></button>
      </div>
    </form>
  </dialog>

  <!-- Import: a CSV file or a .bwv file; duplicates are listed to choose
       about, never overwritten silently (§9). -->
  <dialog id="import-dialog" class="dialog" aria-labelledby="import-title">
    <form id="import-form" class="dialog-body">
      <h2 id="import-title" class="dialog-title" data-l10n-id="passwords-import-title"></h2>
      <p class="muted small" data-l10n-id="passwords-import-text"></p>
      <div class="file-row">
        <button id="import-choose" class="secondary" type="button" data-l10n-id="passwords-import-choose"></button>
        <span id="import-file-name" class="muted small"></span>
      </div>
      <label id="import-passphrase-row" class="dialog-field" hidden="hidden">
        <span id="import-passphrase-label" data-l10n-id="passwords-import-passphrase"></span>
        <input id="import-passphrase" class="field" type="password" autocomplete="off"/>
      </label>
      <div id="import-preview" hidden="hidden">
        <ul id="import-summary" class="summary"></ul>
        <div id="import-duplicates" class="duplicates"></div>
      </div>
      <p id="import-error" class="error" role="alert" hidden="hidden"></p>
      <p id="import-done" class="done" role="status" hidden="hidden"></p>
      <div class="dialog-buttons">
        <button id="import-cancel" class="secondary" type="button" data-l10n-id="passwords-cancel"></button>
        <button id="import-submit" class="primary" type="submit" disabled="disabled" data-l10n-id="passwords-import-continue"></button>
      </div>
    </form>
  </dialog>

  <!-- The recovery key (docs/PASSWORDS.md §6): shown once, right after
       it's made. -->
  <dialog id="recovery-dialog" class="dialog" aria-labelledby="recovery-title">
    <div class="dialog-body recovery-sheet">
      <h2 id="recovery-title" class="dialog-title" data-l10n-id="passwords-recovery-title"></h2>
      <p class="muted small" data-l10n-id="passwords-recovery-text"></p>
      <p id="recovery-code" class="recovery-code" aria-live="polite"></p>
      <p class="muted small" data-l10n-id="passwords-recovery-keep"></p>
      <div class="dialog-buttons">
        <button id="recovery-print" class="secondary" type="button" data-l10n-id="passwords-recovery-print"></button>
        <button id="recovery-done" class="primary" type="button" data-l10n-id="passwords-recovery-done"></button>
      </div>
    </div>
  </dialog>

  <main id="manager" hidden="hidden">
    <div id="list-pane">
      <h2 id="count"></h2>
      <div id="list" role="listbox" tabindex="0" data-l10n-id="passwords-list"></div>
      <p id="no-results" class="muted" hidden="hidden"></p>
    </div>
    <section id="detail" aria-live="polite"></section>
  </main>

  <main id="gate" hidden="hidden">
    <section id="card-locked" class="card" hidden="hidden" aria-labelledby="locked-title">
      <h2 id="locked-title" class="card-title" data-l10n-id="passwords-locked-title"></h2>
      <p class="muted" data-l10n-id="passwords-locked-text"></p>
      <div><button id="unlock-hello" class="primary" type="button" hidden="hidden" data-l10n-id="passwords-use-hello"></button></div>
      <form id="unlock-form" class="card-row">
        <input id="unlock-password" class="field" type="password" autocomplete="off"
               data-l10n-id="passwords-master-password"/>
        <button id="unlock-submit" class="primary" type="submit" data-l10n-id="passwords-unlock"></button>
      </form>
      <p id="unlock-error" class="error" role="alert" hidden="hidden"></p>
      <button id="forgot" class="link" type="button" data-l10n-id="passwords-forgot"></button>
    </section>

    <section id="card-setup" class="card" hidden="hidden" aria-labelledby="setup-title">
      <h2 id="setup-title" class="card-title" data-l10n-id="passwords-setup-page-title"></h2>
      <p class="muted" data-l10n-id="passwords-setup-page-text"></p>
      <form id="setup-form" class="card-stack">
        <input id="setup-password" class="field" type="password" autocomplete="off"
               data-l10n-id="passwords-setup-password"/>
        <input id="setup-confirm" class="field" type="password" autocomplete="off"
               data-l10n-id="passwords-setup-confirm"/>
        <div><button id="setup-suggest" class="link" type="button" data-l10n-id="passwords-suggest-passphrase"></button></div>
        <p id="setup-suggested" class="muted small" hidden="hidden" data-l10n-id="passwords-suggested-note"></p>
        <label class="checkbox">
          <input id="setup-recovery" type="checkbox" checked="checked"/>
          <span data-l10n-id="passwords-setup-recovery"></span>
        </label>
        <p id="setup-error" class="error" role="alert" hidden="hidden"></p>
        <p class="muted small" data-l10n-id="passwords-setup-where"></p>
        <div><button id="setup-submit" class="primary" type="submit" data-l10n-id="passwords-setup-page-create"></button></div>
      </form>
    </section>

    <section id="card-forgot" class="card" hidden="hidden" aria-labelledby="forgot-title">
      <h2 id="forgot-title" class="card-title" data-l10n-id="passwords-forgot-title"></h2>
      <p class="muted" data-l10n-id="passwords-forgot-text"></p>
      <form id="recover-form" class="card-stack" hidden="hidden" aria-labelledby="recover-title">
        <h3 id="recover-title" class="card-title small" data-l10n-id="passwords-recover-title"></h3>
        <input id="recover-code" class="field code-field" type="text" autocomplete="off" spellcheck="false"
               autocapitalize="characters" data-l10n-id="passwords-recover-code"/>
        <input id="recover-password" class="field" type="password" autocomplete="off"
               data-l10n-id="passwords-recover-password"/>
        <input id="recover-confirm" class="field" type="password" autocomplete="off"
               data-l10n-id="passwords-setup-confirm"/>
        <p id="recover-error" class="error" role="alert" hidden="hidden"></p>
        <div><button id="recover-submit" class="primary" type="submit" data-l10n-id="passwords-recover-submit"></button></div>
      </form>
      <form id="start-over-form" class="card-stack start-over" aria-labelledby="start-over-title">
        <h3 id="start-over-title" class="card-title small" data-l10n-id="passwords-start-over-title"></h3>
        <p class="muted small" data-l10n-id="passwords-start-over-text"></p>
        <div class="card-row">
          <input id="start-over-confirm" class="field" type="text" autocomplete="off" spellcheck="false"
                 data-l10n-id="passwords-start-over-confirm"/>
          <button id="start-over-submit" class="danger" type="submit" disabled="disabled" data-l10n-id="passwords-start-over"></button>
        </div>
        <p id="start-over-error" class="error" role="alert" hidden="hidden"></p>
      </form>
      <div><button id="forgot-back" class="secondary" type="button" data-l10n-id="passwords-forgot-back"></button></div>
    </section>

    <section class="card note-card" aria-labelledby="protects-title">
      <h2 id="protects-title" class="card-title small" data-l10n-id="passwords-protects-title"></h2>
      <p class="muted small" data-l10n-id="passwords-protects-text"></p>
    </section>
  </main>
</body>
</html>
