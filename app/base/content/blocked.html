<!-- about:blocked: a page opened in a tab matched one of the lists' rules
     for whole pages (NetworkBlocker.cpp, CheckPage). It runs in the content
     process as an error page, with no privileges, so everything it needs is
     inline (nothing a website could load to detect the browser); the
     BlockedPage actor carries its two buttons to the browser. The CSP
     hashes are checked by tests/unit/blocked-page.test.mjs. -->
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="color-scheme" content="light dark"/>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'sha256-L7tn056h/PYARK2B6DfIIDZKL1CAEyRzS4pP43tbYkM='; style-src 'sha256-DQullKu0dsQLUqi8pcV6PLfFsdIQhbCoBOVH1LX3Y/M='"/>
  <title data-l10n-id="blocked-page-title"></title>
  <link rel="localization" href="branding/brand.ftl"/>
  <link rel="localization" href="browser-wip/blocked.ftl"/>
  <style>
    :root {
      --bg: #FFFFFF;
      --fg: #1B2126;
      --muted: #5C6771;
      --line: #D0D6DB;
      --accent: #0B6E6E;
      --accent-fg: #FFFFFF;
      --warn: #8A4B00;
      --warn-bg: #FBEBD4;
      font: 15px/1.5 "Instrument Sans", system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--fg);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1D2226;
        --fg: #E3E8EB;
        --muted: #96A1AA;
        --line: #2D3439;
        --accent: #5EC4BE;
        --accent-fg: #0F1517;
        --warn: #F2B866;
        --warn-bg: #3A2A14;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      box-sizing: border-box;
    }
    main {
      max-width: 540px;
      display: grid;
      gap: 18px;
    }
    .badge {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background-color: var(--warn-bg);
      color: var(--warn);
    }
    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    p {
      margin: 0;
    }
    #url {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      font: 13px/1.4 ui-monospace, monospace;
      overflow-wrap: anywhere;
    }
    .note {
      color: var(--muted);
      font-size: 13.5px;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 4px;
    }
    button {
      appearance: none;
      height: 38px;
      padding: 0 18px;
      border-radius: 10px;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
    }
    #back {
      border: 0;
      background-color: var(--accent);
      color: var(--accent-fg);
    }
    #continue {
      border: 1px solid var(--line);
      background-color: transparent;
      color: var(--fg);
    }
    #continue:hover {
      border-color: var(--muted);
    }
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main>
    <div class="badge" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.75 2.75 3.6v4.05c0 3.1 2.2 5.55 5.25 6.6 3.05-1.05 5.25-3.5 5.25-6.6V3.6L8 1.75Z"/><path d="m5.9 5.9 4.2 4.2M10.1 5.9l-4.2 4.2"/></svg>
    </div>
    <h1 data-l10n-id="blocked-page-heading"></h1>
    <p id="text"></p>
    <p id="url"></p>
    <div class="buttons">
      <button id="back" type="button" data-l10n-id="blocked-page-back"></button>
      <button id="continue" type="button" data-l10n-id="blocked-page-continue"></button>
    </div>
    <p class="note" data-l10n-id="blocked-page-note"></p>
  </main>
  <script>
    "use strict";
    // What was blocked: `u` in the error page's address (docshell puts it there).
    const blockedURL = new URLSearchParams(document.documentURI.split("?")[1] ?? "").get("u") ?? "";
    let blockedHost = "";
    try {
      blockedHost = new URL(blockedURL).host;
    } catch (e) {}
    document.l10n.setAttributes(document.getElementById("text"), "blocked-page-text", {
      host: blockedHost || blockedURL,
    });
    document.getElementById("url").textContent = blockedURL;
    for (const action of ["back", "continue"]) {
      document.getElementById(action).addEventListener("click", () => {
        document.dispatchEvent(new CustomEvent("BrowserWip:BlockedPage", { detail: action, bubbles: true }));
      });
    }
    document.getElementById("back").focus();
  </script>
</body>
</html>
