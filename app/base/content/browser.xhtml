<?xml version="1.0"?>

   - License, v. 2.0. If a copy of the MPL was not distributed with this
   - file, You can obtain one at http://mozilla.org/MPL/2.0/. -->

<!-- The browser window. Toolbar with the address field, the tab strip below
     it, then the pages. Window decorations come from the desktop. -->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      id="main-window"
      windowtype="navigator:browser"
      width="1200" height="800"
      persist="screenX screenY width height sizemode">
<head>
  <meta http-equiv="Content-Security-Policy"
        content="default-src chrome:; img-src chrome: moz-icon: page-icon: data: blob:; style-src chrome: 'unsafe-inline'; object-src 'none'"/>
  <title data-l10n-id="browser-main-window-title"></title>
  <link rel="stylesheet" href="chrome://global/skin/global.css"/>
  <link rel="stylesheet" href="chrome://browser-wip/skin/browser.css"/>
  <link rel="localization" href="branding/brand.ftl"/>
  <link rel="localization" href="browser-wip/browser.ftl"/>
  <link rel="localization" href="browser-wip/passwords.ftl"/>
  <script src="chrome://browser-wip/content/tabbrowser.js"/>
  <script src="chrome://browser-wip/content/letterbox.js"/>
  <script src="chrome://browser-wip/content/downloads.js"/>
  <script src="chrome://browser-wip/content/contextmenu.js"/>
  <script src="chrome://browser-wip/content/permissions.js"/>
  <script src="chrome://browser-wip/content/taboverview.js"/>
  <script src="chrome://browser-wip/content/fullscreen.js"/>
  <script src="chrome://browser-wip/content/passwords.js"/>
  <script src="chrome://browser-wip/content/urlbar.js"/>
  <script src="chrome://browser-wip/content/browser.js"/>
</head>
<body>
  <xul:commandset id="main-commands">
    <xul:command id="cmd_newTab"/>
    <xul:command id="cmd_closeTab"/>
    <xul:command id="cmd_reopenTab"/>
    <xul:command id="cmd_focusUrlbar"/>
    <xul:command id="cmd_back"/>
    <xul:command id="cmd_forward"/>
    <xul:command id="cmd_reload"/>
    <xul:command id="cmd_reloadSkipCache"/>
    <xul:command id="cmd_nextTab"/>
    <xul:command id="cmd_prevTab"/>
    <xul:command id="cmd_moveTabNext"/>
    <xul:command id="cmd_moveTabPrev"/>
    <xul:command id="cmd_settings"/>
    <xul:command id="cmd_downloads"/>
    <xul:command id="cmd_restoreSession"/>
    <xul:command id="cmd_tabOverview"/>
    <xul:command id="cmd_newWindow"/>
    <xul:command id="cmd_closeWindow"/>
    <xul:command id="cmd_quit"/>
    <xul:command id="cmd_find"/>
    <xul:command id="cmd_findAgain"/>
    <xul:command id="cmd_findPrevious"/>
  </xul:commandset>

  <!-- reserved="true": handled by the browser even when a page has focus. -->
  <xul:keyset id="main-keys">
    <xul:key id="key_newTab" key="t" modifiers="accel" command="cmd_newTab" reserved="true"/>
    <xul:key id="key_closeTab" key="w" modifiers="accel" command="cmd_closeTab" reserved="true"/>
    <xul:key id="key_reopenTab" key="t" modifiers="accel,shift" command="cmd_reopenTab" reserved="true"/>
    <xul:key id="key_newWindow" key="n" modifiers="accel" command="cmd_newWindow" reserved="true"/>
    <xul:key id="key_closeWindow" key="w" modifiers="accel,shift" command="cmd_closeWindow" reserved="true"/>
    <xul:key id="key_focusUrlbar" key="l" modifiers="accel" command="cmd_focusUrlbar" reserved="true"/>
    <xul:key id="key_focusUrlbar2" keycode="VK_F6" command="cmd_focusUrlbar"/>
    <xul:key id="key_back" keycode="VK_LEFT" modifiers="alt" command="cmd_back"/>
    <xul:key id="key_forward" keycode="VK_RIGHT" modifiers="alt" command="cmd_forward"/>
    <xul:key id="key_reload" key="r" modifiers="accel" command="cmd_reload"/>
    <xul:key id="key_reload2" keycode="VK_F5" command="cmd_reload"/>
    <xul:key id="key_reloadSkipCache" key="r" modifiers="accel,shift" command="cmd_reloadSkipCache"/>
    <xul:key id="key_nextTab" keycode="VK_TAB" modifiers="control" command="cmd_nextTab" reserved="true"/>
    <xul:key id="key_prevTab" keycode="VK_TAB" modifiers="control,shift" command="cmd_prevTab" reserved="true"/>
    <xul:key id="key_nextTab2" keycode="VK_PAGE_DOWN" modifiers="accel" command="cmd_nextTab" reserved="true"/>
    <xul:key id="key_prevTab2" keycode="VK_PAGE_UP" modifiers="accel" command="cmd_prevTab" reserved="true"/>
    <xul:key id="key_moveTabNext" keycode="VK_PAGE_DOWN" modifiers="accel,shift" command="cmd_moveTabNext"/>
    <xul:key id="key_moveTabPrev" keycode="VK_PAGE_UP" modifiers="accel,shift" command="cmd_moveTabPrev"/>
    <xul:key id="key_downloads" key="j" modifiers="accel" command="cmd_downloads"/>
    <xul:key id="key_tabOverview" key="a" modifiers="accel,shift" command="cmd_tabOverview"/>
    <xul:key id="key_find" key="f" modifiers="accel" command="cmd_find"/>
    <xul:key id="key_findAgain" key="g" modifiers="accel" command="cmd_findAgain"/>
    <xul:key id="key_findPrevious" key="g" modifiers="accel,shift" command="cmd_findPrevious"/>
    <xul:key id="key_findAgain2" keycode="VK_F3" command="cmd_findAgain"/>
    <xul:key id="key_findPrevious2" keycode="VK_F3" modifiers="shift" command="cmd_findPrevious"/>
  </xul:keyset>

  <xul:popupset id="main-popupset">
    <xul:menupopup id="app-menu" class="wip-menu">
      <xul:menuitem data-l10n-id="app-menu-new-tab" key="key_newTab" command="cmd_newTab"/>
      <xul:menuitem data-l10n-id="app-menu-new-window" key="key_newWindow" command="cmd_newWindow"/>
      <xul:menuitem id="app-menu-restore-session" data-l10n-id="app-menu-restore-session" command="cmd_restoreSession"/>
      <xul:menuseparator/>
      <xul:menuitem data-l10n-id="app-menu-downloads" key="key_downloads" command="cmd_downloads"/>
      <xul:menuitem data-l10n-id="app-menu-settings" command="cmd_settings"/>
      <xul:menuseparator/>
      <xul:menuitem data-l10n-id="app-menu-quit" command="cmd_quit"/>
    </xul:menupopup>

    <!-- The right-click menu on pages (contextmenu.js). data-show lists the
         contexts an item belongs to; separators are tidied when it opens. -->
    <xul:menupopup id="content-context-menu" class="wip-menu">
      <xul:menuitem id="context-back" data-show="page" data-l10n-id="context-back"/>
      <xul:menuitem id="context-forward" data-show="page" data-l10n-id="context-forward"/>
      <xul:menuitem id="context-reload" data-show="page" data-l10n-id="context-reload"/>
      <xul:menuseparator/>
      <xul:menuitem id="context-openlink-tab" data-show="link" data-l10n-id="context-openlink-tab"/>
      <xul:menuitem id="context-openlink-window" data-show="link" data-l10n-id="context-openlink-window"/>
      <xul:menuitem id="context-copylink" data-show="link" data-l10n-id="context-copylink"/>
      <xul:menuitem id="context-savelink" data-show="link" data-l10n-id="context-savelink"/>
      <xul:menuseparator/>
      <xul:menuitem id="context-openimage" data-show="image" data-l10n-id="context-openimage"/>
      <xul:menuitem id="context-copyimage" data-show="image" data-l10n-id="context-copyimage"/>
      <xul:menuitem id="context-copyimage-link" data-show="image" data-l10n-id="context-copyimage-link"/>
      <xul:menuitem id="context-saveimage" data-show="image" data-l10n-id="context-saveimage"/>
      <xul:menuseparator/>
      <xul:menuitem id="context-openmedia" data-show="media" data-l10n-id="context-openmedia"/>
      <xul:menuitem id="context-copymedia" data-show="media" data-l10n-id="context-copymedia"/>
      <xul:menuitem id="context-savemedia" data-show="media" data-l10n-id="context-savemedia"/>
      <xul:menuseparator/>
      <xul:menuitem id="context-copy" data-show="selection-only" data-l10n-id="context-copy"/>
      <xul:menuitem id="context-search" data-show="selection" data-l10n-id="context-search"/>
      <xul:menuseparator/>
      <xul:menuitem id="context-undo" data-show="editable" data-l10n-id="context-undo"/>
      <xul:menuseparator/>
      <xul:menuitem id="context-cut" data-show="editable" data-l10n-id="context-cut"/>
      <xul:menuitem id="context-copy-edit" data-show="editable" data-l10n-id="context-copy"/>
      <xul:menuitem id="context-paste" data-show="editable" data-l10n-id="context-paste"/>
      <xul:menuitem id="context-delete" data-show="editable" data-l10n-id="context-delete"/>
      <xul:menuseparator/>
      <xul:menuitem id="context-selectall" data-show="editable page" data-l10n-id="context-selectall"/>
      <xul:menuseparator/>
      <xul:menuitem id="context-savepage" data-show="page" data-l10n-id="context-savepage"/>
      <xul:menuitem id="context-viewsource" data-show="page" data-l10n-id="context-viewsource"/>
    </xul:menupopup>

    <xul:menupopup id="tab-context-menu" class="wip-menu">
      <xul:menuitem id="tab-ctx-reload" data-l10n-id="tab-context-reload"/>
      <xul:menuitem id="tab-ctx-duplicate" data-l10n-id="tab-context-duplicate"/>
      <xul:menuitem id="tab-ctx-pin" data-l10n-id="tab-context-pin"/>
      <xul:menuitem id="tab-ctx-mute" data-l10n-id="tab-context-mute"/>
      <xul:menuseparator/>
      <xul:menuitem id="tab-ctx-close" data-l10n-id="tab-context-close"/>
      <xul:menuitem id="tab-ctx-close-others" data-l10n-id="tab-context-close-others"/>
      <xul:menuitem id="tab-ctx-reopen" data-l10n-id="tab-context-reopen" key="key_reopenTab"/>
    </xul:menupopup>

    <xul:panel id="protections-panel" class="wip-panel" type="arrow" role="dialog"
               aria-labelledby="protections-title">
      <div class="panel-body">
        <h2 id="protections-title" class="panel-title"></h2>
        <p id="protections-summary" class="panel-text"></p>
        <div class="panel-row">
          <label id="protections-toggle-label" for="protections-toggle"
                 data-l10n-id="protections-toggle-label"></label>
          <button id="protections-toggle" class="switch" role="switch" aria-checked="true"/>
        </div>
        <p class="panel-text" data-l10n-id="protections-toggle-help"></p>
        <button class="panel-link" data-l10n-id="protections-open-settings"
                data-command="cmd_settings"/>
      </div>
    </xul:panel>

    <xul:panel id="downloads-panel" class="wip-panel" type="arrow" role="dialog"
               aria-labelledby="downloads-title">
      <div class="panel-body">
        <h2 id="downloads-title" class="panel-title" data-l10n-id="downloads-title"></h2>
        <div id="downloads-list" role="list" aria-labelledby="downloads-title"></div>
        <p id="downloads-empty" class="panel-text" data-l10n-id="downloads-empty"></p>
        <div class="panel-row downloads-footer">
          <button id="downloads-open-folder" class="panel-link" data-l10n-id="downloads-open-folder"/>
          <button id="downloads-clear" class="panel-link" data-l10n-id="downloads-clear"/>
        </div>
      </div>
    </xul:panel>

    <!-- Permission prompts (permissions.js). Stays open while the user
         clicks in the page; answered with Allow, Block or Escape. -->
    <xul:panel id="permission-panel" class="wip-panel" type="arrow" role="alertdialog"
               noautohide="true" aria-labelledby="permission-message">
      <div class="panel-body">
        <p id="permission-message" class="panel-title"></p>
        <label id="permission-video-row" class="permission-device" hidden="true">
          <span></span>
          <xul:menulist id="permission-video" sizetopopup="none"/>
        </label>
        <label id="permission-audio-row" class="permission-device" hidden="true">
          <span data-l10n-id="permission-microphone-label"></span>
          <xul:menulist id="permission-audio" sizetopopup="none"/>
        </label>
        <label id="permission-remember-row" class="permission-remember">
          <input id="permission-remember" type="checkbox"/>
          <span data-l10n-id="permission-remember"></span>
        </label>
        <div class="permission-buttons">
          <button id="permission-block" class="panel-button" data-l10n-id="permission-block"/>
          <button id="permission-allow" class="panel-button primary" data-l10n-id="permission-allow"/>
        </div>
      </div>
    </xul:panel>

    <xul:panel id="sharing-panel" class="wip-panel" type="arrow" role="dialog"
               aria-labelledby="sharing-message">
      <div class="panel-body">
        <p id="sharing-message" class="panel-title"></p>
        <div class="permission-buttons">
          <button id="sharing-stop" class="panel-button" data-l10n-id="sharing-stop"/>
        </div>
      </div>
    </xul:panel>

    <xul:panel id="identity-panel" class="wip-panel" type="arrow" role="dialog"
               aria-labelledby="identity-title">
      <div class="panel-body">
        <h2 id="identity-title" class="panel-title"></h2>
        <p id="identity-summary" class="panel-text"></p>
      </div>
    </xul:panel>
    <!-- Passwords (passwords.js): save or update a login, unlock, set up,
         and the site's logins, all under the key button. view= picks one. -->
    <xul:panel id="passwords-panel" class="wip-panel" type="arrow" role="dialog"
               aria-labelledby="passwords-title">
      <div class="panel-body">
        <h2 id="passwords-title" class="panel-title"></h2>
        <p id="passwords-text" class="panel-text"></p>

        <div id="passwords-save-view" class="passwords-view">
          <label class="passwords-field">
            <span data-l10n-id="passwords-username-label"></span>
            <input id="passwords-save-username" class="passwords-input" type="text"
                   spellcheck="false" autocomplete="off" data-l10n-id="passwords-username-none"/>
          </label>
          <div class="passwords-field">
            <span id="passwords-save-password-label" data-l10n-id="passwords-password-label"></span>
            <div class="passwords-secret">
              <span id="passwords-save-secret" aria-labelledby="passwords-save-password-label"></span>
              <button id="passwords-save-reveal" class="passwords-icon-button" data-l10n-id="passwords-show-password">
                <img class="icon" src="chrome://browser-wip/skin/icons/eye.svg" alt=""/>
              </button>
            </div>
          </div>
          <div class="passwords-buttons">
            <button id="passwords-save-more" class="passwords-icon-button bordered" data-l10n-id="passwords-more-options">
              <img class="icon" src="chrome://browser-wip/skin/icons/more.svg" alt=""/>
            </button>
            <span class="passwords-spacer"></span>
            <button id="passwords-save-later" class="panel-button" data-l10n-id="passwords-not-now"/>
            <button id="passwords-save-confirm" class="panel-button primary" data-l10n-id="passwords-save"/>
          </div>
        </div>

        <div id="passwords-saved-view" class="passwords-view">
          <div class="passwords-buttons">
            <span class="passwords-spacer"></span>
            <button id="passwords-saved-undo" class="panel-button" data-l10n-id="passwords-undo"/>
          </div>
        </div>

        <div id="passwords-unlock-view" class="passwords-view">
          <form id="passwords-unlock-form" class="passwords-inline">
            <input id="passwords-unlock-password" class="passwords-input" type="password"
                   autocomplete="off" data-l10n-id="passwords-master-password"/>
            <button id="passwords-unlock-submit" class="panel-button" type="submit" data-l10n-id="passwords-unlock"/>
          </form>
          <p id="passwords-unlock-error" class="passwords-error" role="alert" hidden="true"
             data-l10n-id="passwords-wrong-password"></p>
          <div class="passwords-footer">
            <button id="passwords-forgot" class="panel-link" data-l10n-id="passwords-forgot"/>
            <span id="passwords-locks-after" class="passwords-note"></span>
          </div>
        </div>

        <div id="passwords-setup-view" class="passwords-view">
          <form id="passwords-setup-form" class="passwords-stack">
            <input id="passwords-setup-password" class="passwords-input" type="password"
                   autocomplete="off" data-l10n-id="passwords-setup-password"/>
            <input id="passwords-setup-confirm" class="passwords-input" type="password"
                   autocomplete="off" data-l10n-id="passwords-setup-confirm"/>
            <p id="passwords-setup-error" class="passwords-error" role="alert" hidden="true"></p>
            <p class="passwords-note" data-l10n-id="passwords-setup-where"></p>
            <div class="passwords-buttons">
              <span class="passwords-spacer"></span>
              <button id="passwords-setup-cancel" class="panel-button" type="button" data-l10n-id="passwords-setup-cancel"/>
              <button id="passwords-setup-create" class="panel-button primary" type="submit" data-l10n-id="passwords-setup-create"/>
            </div>
          </form>
        </div>

        <div id="passwords-site-view" class="passwords-view">
          <div id="passwords-site-list" role="list" aria-labelledby="passwords-title"></div>
          <div class="passwords-footer">
            <button id="passwords-site-manage" class="panel-link" data-l10n-id="passwords-manage-link"/>
            <button id="passwords-site-lock" class="panel-link" data-l10n-id="passwords-lock-now"/>
          </div>
        </div>

        <div id="passwords-intro-view" class="passwords-view">
          <div class="passwords-buttons">
            <button id="passwords-intro-manage" class="panel-link" data-l10n-id="passwords-manage-link"/>
            <span class="passwords-spacer"></span>
            <button id="passwords-intro-setup" class="panel-button primary" data-l10n-id="passwords-setup-title"/>
          </div>
        </div>
      </div>
    </xul:panel>

    <xul:menupopup id="passwords-more-menu" class="wip-menu">
      <xul:menuitem id="passwords-never" data-l10n-id="passwords-never-for-site"/>
      <xul:menuitem id="passwords-more-manage" data-l10n-id="passwords-manage"/>
    </xul:menupopup>

    <!-- Saved logins under a login field (passwords.js). Opened by a click in
         the field or ArrowDown; focus stays in the page, which forwards the
         arrow keys, Enter and Escape. -->
    <xul:panel id="passwords-dropdown" class="passwords-dropdown" noautofocus="true"
               consumeoutsideclicks="never" level="parent" role="listbox"
               data-l10n-id="passwords-dropdown-label">
      <div id="passwords-dropdown-body"></div>
    </xul:panel>
  </xul:popupset>

  <header id="nav-bar" role="toolbar" data-l10n-id="nav-bar">
    <div id="nav-buttons">
      <button id="back-button" class="toolbar-button" data-l10n-id="back-button" data-command="cmd_back" disabled="true">
        <img class="icon" src="chrome://browser-wip/skin/icons/back.svg" alt=""/>
      </button>
      <button id="forward-button" class="toolbar-button" data-l10n-id="forward-button" data-command="cmd_forward" disabled="true">
        <img class="icon" src="chrome://browser-wip/skin/icons/forward.svg" alt=""/>
      </button>
      <button id="reload-button" class="toolbar-button" data-l10n-id="reload-button" data-command="cmd_reload">
        <img class="icon" src="chrome://browser-wip/skin/icons/reload.svg" alt=""/>
      </button>
    </div>

    <div id="urlbar">
      <button id="identity-button" class="urlbar-button" data-l10n-id="identity-button-secure">
        <img id="identity-icon" class="icon" src="chrome://browser-wip/skin/icons/site-info.svg" alt=""/>
        <span id="identity-label" data-l10n-id="identity-not-secure"></span>
      </button>
      <div id="urlbar-input-box">
        <input id="urlbar-input" type="text" spellcheck="false" autocomplete="off"
               data-l10n-id="urlbar-input"/>
        <div id="urlbar-display" aria-hidden="true"></div>
      </div>
      <button id="sharing-button" class="urlbar-button" hidden="true" data-l10n-id="sharing-button">
        <img class="icon" src="chrome://browser-wip/skin/icons/camera.svg" alt=""/>
      </button>
      <button id="passwords-button" class="urlbar-button" hidden="true" data-l10n-id="passwords-button">
        <img class="icon" src="chrome://browser-wip/skin/icons/key.svg" alt=""/>
      </button>
      <button id="protections-button" class="urlbar-button" data-l10n-id="protections-button">
        <img id="protections-icon" class="icon" src="chrome://browser-wip/skin/icons/shield.svg" alt=""/>
        <span id="protections-count"></span>
      </button>
      <div id="urlbar-progress"></div>
    </div>

    <div id="tool-buttons">
      <button id="downloads-button" class="toolbar-button" data-l10n-id="downloads-button" hidden="true">
        <img class="icon" src="chrome://browser-wip/skin/icons/download.svg" alt=""/>
      </button>
      <button id="app-menu-button" class="toolbar-button" data-l10n-id="app-menu-button">
        <img class="icon" src="chrome://browser-wip/skin/icons/menu.svg" alt=""/>
      </button>
    </div>

    <!-- Window controls, shown only where the app draws its own title bar
         (Windows). On Linux the desktop draws them. -->
    <div id="window-controls" hidden="true">
      <button id="window-minimize" class="caption-button" data-l10n-id="window-minimize"/>
      <button id="window-maximize" class="caption-button" data-l10n-id="window-maximize"/>
      <button id="window-restore" class="caption-button" data-l10n-id="window-restore"/>
      <button id="window-close" class="caption-button" data-l10n-id="window-close"/>
    </div>
  </header>

  <div id="tab-strip">
    <div id="tabs" role="tablist" data-l10n-id="tab-strip"></div>
    <button id="new-tab-button" class="toolbar-button" data-l10n-id="new-tab-button" data-command="cmd_newTab">
      <img class="icon" src="chrome://browser-wip/skin/icons/plus.svg" alt=""/>
    </button>
    <button id="tab-overview-button" class="toolbar-button" data-l10n-id="tab-overview-button" data-command="cmd_tabOverview">
      <img class="icon" src="chrome://browser-wip/skin/icons/tabs.svg" alt=""/>
    </button>
  </div>

  <div id="browsers"></div>
  <xul:findbar id="findbar" hidden="true"/>

  <!-- Tab overview (taboverview.js), over the page area. -->
  <div id="tab-overview" role="dialog" aria-labelledby="tab-overview-count" hidden="true">
    <div class="overview-header">
      <input id="tab-overview-search" type="search" data-l10n-id="tab-overview-search"/>
      <span id="tab-overview-count"></span>
    </div>
    <div id="tab-overview-grid"></div>
  </div>

  <!-- While a page is in fullscreen (fullscreen.js). A popover, so it shows
       above the fullscreen page. -->
  <div id="fullscreen-warning" popover="manual" role="alert">
    <span id="fullscreen-warning-text"></span>
    <button id="fullscreen-exit-button" class="panel-button" data-l10n-id="fullscreen-exit-button"/>
  </div>
</body>
</html>
