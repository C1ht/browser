<!-- about:settings. Every control applies immediately. -->
<html>
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="Content-Security-Policy"
        content="default-src chrome:; style-src chrome:; object-src 'none'"/>
  <title data-l10n-id="settings-page-title"></title>
  <link rel="stylesheet" href="chrome://browser-wip/skin/pages.css"/>
  <link rel="stylesheet" href="chrome://browser-wip/skin/settings.css"/>
  <link rel="localization" href="branding/brand.ftl"/>
  <link rel="localization" href="browser-wip/privacy.ftl"/>
  <link rel="localization" href="browser-wip/settings.ftl"/>
  <script src="chrome://browser-wip/content/privacy-controls.js"></script>
  <script src="chrome://browser-wip/content/settings.js"></script>
</head>
<body>
  <main id="settings">
    <h1 data-l10n-id="settings-heading"></h1>

    <section id="privacy" aria-labelledby="privacy-heading">
      <h2 id="privacy-heading" data-l10n-id="settings-privacy-heading"></h2>
      <div id="modes" class="modes"></div>
      <div id="toggles" class="toggles"></div>
      <div id="restart-row" class="inline-row" hidden="hidden">
        <p data-l10n-id="settings-restart-needed"></p>
        <button id="restart" class="secondary" type="button" data-l10n-id="settings-restart"></button>
      </div>
    </section>

    <section id="startup" aria-labelledby="startup-heading">
      <h2 id="startup-heading" data-l10n-id="settings-startup-heading"></h2>
      <div class="segmented" role="radiogroup" aria-labelledby="startup-heading">
        <button type="button" role="radio" data-value="newtab" data-l10n-id="settings-startup-newtab"></button>
        <button type="button" role="radio" data-value="restore" data-l10n-id="settings-startup-restore"></button>
      </div>
      <p class="muted" data-l10n-id="settings-startup-help"></p>
    </section>

    <section id="search" aria-labelledby="search-heading">
      <h2 id="search-heading" data-l10n-id="settings-search-heading"></h2>
      <div class="inline-row">
        <label for="search-engine" data-l10n-id="settings-search-engine"></label>
        <select id="search-engine">
          <option value="brave">Brave Search</option>
          <option value="duckduckgo">DuckDuckGo</option>
          <option value="startpage">Startpage</option>
          <option value="mojeek">Mojeek</option>
        </select>
      </div>
    </section>

    <section id="downloads" aria-labelledby="downloads-heading">
      <h2 id="downloads-heading" data-l10n-id="settings-downloads-heading"></h2>
      <div class="inline-row">
        <div class="folder">
          <span data-l10n-id="settings-downloads-folder"></span>
          <span id="downloads-folder" class="muted"></span>
        </div>
        <button id="downloads-change" class="secondary" type="button" data-l10n-id="settings-downloads-change"></button>
      </div>
      <div class="toggle-row">
        <div>
          <label id="downloads-ask-label" for="downloads-ask" data-l10n-id="settings-downloads-ask-label"></label>
          <span class="help" data-l10n-id="settings-downloads-ask-help"></span>
        </div>
        <button id="downloads-ask" class="switch" type="button" role="switch" aria-labelledby="downloads-ask-label"></button>
      </div>
    </section>

    <section id="appearance" aria-labelledby="appearance-heading">
      <h2 id="appearance-heading" data-l10n-id="settings-appearance-heading"></h2>
      <div class="segmented" role="radiogroup" aria-labelledby="appearance-heading">
        <button type="button" role="radio" data-value="auto" data-l10n-id="settings-appearance-auto"></button>
        <button type="button" role="radio" data-value="light" data-l10n-id="settings-appearance-light"></button>
        <button type="button" role="radio" data-value="dark" data-l10n-id="settings-appearance-dark"></button>
      </div>
    </section>

    <section id="about" aria-labelledby="about-heading">
      <h2 id="about-heading" data-l10n-id="settings-about-heading"></h2>
      <p id="version"></p>
      <p class="muted" data-l10n-id="settings-about-lists"></p>
      <p class="muted" id="lists-snapshot"></p>
    </section>
  </main>
</body>
</html>
